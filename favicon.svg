<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff3d00"/>
      <stop offset="100%" style="stop-color:#ff6f00"/>
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="#0a0a0a"/>
  
  <!-- Outer ring -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="url(#grad)" stroke-width="20" opacity="0.3"/>
  
  <!-- Inner glowing dot -->
  <circle cx="256" cy="256" r="100" fill="url(#grad)"/>
  
  <!-- Highlight -->
  <circle cx="220" cy="220" r="30" fill="white" opacity="0.3"/>
</svg>
